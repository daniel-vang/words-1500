<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f1ea" />
  <title>初中英语单词练习</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="stats hidden" id="stats">已学 0 个 · 中文 0 个</div>
  <div class="app">
    <main class="card">
      <div class="word" id="word">点击开始</div>
      <div class="phonetic" id="phonetic"></div>

      <div class="status" id="status">准备开始</div>
      <div class="meaning" id="meaning"></div>

      <div class="actions">
        <button id="nextBtn" class="ghost" disabled>继续</button>
        <button id="repeatBtn" class="ghost" disabled>朗读</button>
        <button id="showMeaningBtn" class="ghost" disabled>中文</button>
      </div>

      <div class="controls">
        <button id="micBtn" class="mic-toggle" type="button" aria-pressed="false">麦克风</button>
        <div class="list-toggle" role="group" aria-label="词库选择">
          <button type="button" class="toggle-btn active" data-file="words-1500.json">初中1500</button>
          <button type="button" class="toggle-btn" data-file="words-3000.json">初中3000</button>
        </div>
        <button id="helpBtn" class="help-toggle" type="button" aria-pressed="false">帮助</button>
      </div>

    </main>

  </div>
  <div id="touch-overlay" aria-hidden="true">
    <div class="touch-area" data-zone="tl" data-label="上一个" id="touch-tl"></div>
    <div class="touch-area" data-zone="tm" data-label="中文" id="touch-tm"></div>
    <div class="touch-area" data-zone="tr" data-label="上一个" id="touch-tr"></div>
    <div class="touch-area" data-zone="lm" data-label="统计" id="touch-lm"></div>
    <div class="touch-area" data-zone="rm" data-label="中文" id="touch-rm"></div>
    <div class="touch-area" data-zone="bl" data-label="下一个" id="touch-bl"></div>
    <div class="touch-area" data-zone="bm" data-label="朗读" id="touch-bm"></div>
    <div class="touch-area" data-zone="br" data-label="下一个" id="touch-br"></div>
  </div>

  <script src="words-1500.js"></script>
  <script src="words-3000.js"></script>
  <script src="app.js"></script>
</body>
</html>
